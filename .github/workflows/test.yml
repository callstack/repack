name: CI Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
  pull_request:
    paths-ignore:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # tag=v4.2.2
      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-version: '24.22.1'

      - name: Lint
        run: pnpm lint:ci

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # tag=v4.2.2
      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-version: '24.22.1'

      - name: Type check
        run: pnpm typecheck

  test_pr:
    name: Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # tag=v4.2.2
      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-version: '24.22.1'

      - name: Run tests
        run: pnpm test

  release-automation:
    name: Release automation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # tag=v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # tag=v4.4.0
        with:
          node-version: '24'
      - name: Test combined release generation and publishing
        run: node --test .github/scripts/*.test.mjs
