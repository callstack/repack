name: e2e

# Module Federation v2 e2e on a real Android emulator, mirroring the local flow:
# start both dev servers, build the app, run the tests on a booted device.
#
# `pull_request_target` runs workflow code from the base revision, so a
# contributor cannot change what executes; the PR head is checked out
# explicitly below. The job reads no secrets (every test is deterministic) and
# the token is pinned to `contents: read`.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

# An emulator run is too expensive to let superseded commits queue up behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: e2e (Android)
    # Same-repo PRs run unconditionally; a fork PR runs while the `e2e` label
    # is on it (the label does not exist in repo settings yet). No workflow-level
    # `paths:` filter — a path-filtered required check is never created and the
    # merge hangs forever.
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # NOT continue-on-error. A job that cannot fail reports green over red
    # tests: run 38408377768 concluded "success" with the Gallery test failing.
    # Still not a *required* check — branch protection is a separate decision
    # and the suite has no stability history — but "not required" and "cannot
    # fail" are independent switches, and only the first one is set here.

    steps:
      # pull_request_target checks out the base by default, which would test
      # the wrong code; every other trigger has no PR context and falls
      # through to github.sha.
      - name: Checkout pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # tag=v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm-node
        with:
          # e2e requires Node ^22.22.3 || >=24.8.0; exact pin so the floor
          # cannot drift.
          node-version: '24.18.0'

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # tag=v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Required by android-emulator-runner on GitHub-hosted runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No caching, deliberately, until this lane is reliably green. Neither cache
      # had ever been written or hit — `actions/cache` only saves on a green run
      # and every run so far was red — so deleting them costs no time and removes
      # a variable: nothing here depends on state an earlier run left behind.
      #
      # The dev servers are the thing under test: this is how the PR's Repack
      # change reaches them (workspace dist/ is gitignored).
      - name: Build workspace packages
        run: pnpm --filter tester-federation-v2... build

      # Servers before Gradle so their cold compile overlaps the build and the
      # emulator boot — but "listening" is not "compiled", so the overlap only
      # happens if something actually asks for a bundle (see the warm step).
      # nohup/disown because the action runs each script line in its own shell
      # and these must outlive this step. The /status wait is not ceremony:
      # react-native-test-app picks its bundle source once at app start and
      # never retries, so an app launched while 8081 is still booting shows an
      # alert no later tap dismisses.
      - name: Start dev servers
        working-directory: apps/tester-federation-v2
        run: |
          nohup pnpm start:hostapp > /tmp/hostapp.log 2>&1 &
          disown
          nohup pnpm start:miniapp > /tmp/miniapp.log 2>&1 &
          disown
          timeout 180 sh -c 'until [ "$(curl -sf localhost:8081/status)" = "packager-status:running" ] && [ "$(curl -sf localhost:8082/status)" = "packager-status:running" ]; do sleep 2; done'

      # /status answers as soon as the server *listens* (createServer.ts
      # registers it as a static reply — it never touches the compiler), and
      # Re.Pack builds a platform lazily, on that platform's first asset
      # request: Compiler.ts `getAsset` -> `activatePlatform`, with a `watchRun`
      # hook that parks the initial build until then. So the previous step's
      # wait started the overlap it was meant to have but never achieved: in run
      # 38408377768 both servers listened at 06:09:13 and the host did not
      # compile until 06:16:55, and 8082 never compiled at all — the device
      # never sent it a single request, which is why the Gallery test hung.
      # These two fetches are what make the overlap real, and they move 8082's
      # cold build off the device's critical path, where it currently lands
      # *after* a tap and gets killed when the step ends.
      #
      # The paths are RNTA's dev-bundle shape (verified against a live 8082:
      # `/android/index.bundle?platform=android` -> 200 + "Compiled android",
      # while the Metro-style `/index.android.bundle` 404s). The compile is
      # keyed per platform, so any accepted filename triggers it; the params
      # mirror what the app itself sends.
      #
      # A cold miss takes seconds (host: 10.5s, warm cache). 300s of budget, and
      # -f so a server that 404s or dies fails the step here rather than
      # presenting as a test failure 15 minutes later.
      - name: Warm both compilers
        working-directory: apps/tester-federation-v2
        run: |
          curl -sf --max-time 300 -o /dev/null 'http://localhost:8081/android/index.bundle?platform=android&dev=true&lazy=true&minify=false&app=com.tester.federationV2&modulesOnly=false&runModule=true'
          curl -sf --max-time 300 -o /dev/null 'http://localhost:8082/android/index.bundle?platform=android&dev=true&lazy=true&minify=false&app=com.tester.federationV2&modulesOnly=false&runModule=true'
          echo 'Both bundles served; compilers are warm.'

      - name: Build Android app
        working-directory: apps/tester-federation-v2/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64

      # The reverses are load-bearing for 8082: the MiniApp remote URL is baked
      # into the bundle as http://localhost:8082/..., and the device's localhost
      # is the device itself (8081 needs no reverse — the app reaches it via
      # 10.0.2.2). Proven locally: with reverses wiped, exactly the Gallery
      # test fails. google_apis, never google_apis_playstore — the Play image
      # could not launch the app in earlier testing (unconfirmed mechanism; do
      # not switch without verifying).
      - name: Run e2e on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # tag=v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          working-directory: apps/tester-federation-v2
          # Every line here is run in its own `sh -c`: the action's
          # script-parser.ts splits this input on newlines and drops lines
          # starting with '#', so no multi-line construct (no `for`/`if`/here-doc
          # blocks) and no comments may be relied on. Keep each check one line.
          script: |
            free -m
            ps -eo rss,comm --sort=-rss | head -n 8
            uptime
            adb logcat -d -v time > /tmp/logcat.txt 2>&1
            nohup adb logcat -v time >> /tmp/logcat.txt 2>&1 &
            adb shell settings put global hide_error_dialogs 1
            adb reverse tcp:8081 tcp:8081
            adb reverse tcp:8082 tcp:8082
            adb reverse --list
            adb reverse --list | grep -q 'tcp:8081' || { echo '::error::adb reverse missing for tcp:8081'; exit 1; }
            adb reverse --list | grep -q 'tcp:8082' || { echo '::error::adb reverse missing for tcp:8082'; exit 1; }
            adb install -r -g android/app/build/outputs/apk/debug/app-debug.apk
            pnpm exec e2e run --target android --reporter list,junit

      # !cancelled() keeps evidence from a test that failed then passed on
      # retry. include-hidden-files is the load-bearing line: upload-artifact
      # v7.0.1 passes `excludeHiddenFiles: !includeHiddenFiles` into
      # @actions/glob and the input defaults to false, so a path whose basename
      # starts with a dot — `.e2e` — matches zero files. Run 38408377768 then
      # reported the step a *success* having uploaded nothing (`total_count: 0`
      # artifacts, one `##[warning]No files were found`), and the trace and
      # screenshots that would have said what was on screen were gone. Verified
      # by experiment against @actions/glob, not inferred. if-no-files-found:
      # error so a missing evidence directory is a build failure, never a
      # warning that scrolls past again.
      - name: Upload e2e artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: e2e-android
          path: apps/tester-federation-v2/.e2e
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # The nohup'd server logs are otherwise invisible, and they are the one
      # diagnostic that survives on its own (they live outside `.e2e`, so they
      # arrive even when the upload above does not). On a red run read this step
      # first: "Compiled android" under each port is the whole story of whether
      # the device ever reached that server. !cancelled() rather than failure()
      # so a cancelled run keeps them too.
      - name: Show dev server logs
        if: ${{ !cancelled() }}
        run: tail -n 80 /tmp/hostapp.log /tmp/miniapp.log

      # The only step whose purpose is to find the cause rather than prove the
      # symptom. Runs 38531417287 and 38557739117 both froze the same way — every
      # test timed out against a 12-node screen tree that turned out to be
      # Android's own "Pixel Launcher isn't responding" dialog — and nothing in
      # the server logs, the traces or the screenshots says why the launcher
      # stopped responding. logcat is where the system writes that verdict: the
      # ANRing process, the reason, and the load average and CPU split at the
      # moment of the freeze. Without it every next step is a guess at cores or
      # API level or profile; with it, the fix has a name.
      - name: Show the ANR report
        if: ${{ failure() }}
        run: |
          test -s /tmp/logcat.txt || { echo 'no logcat captured'; exit 0; }
          echo '### ANR / crash lines'
          grep -iE "ANR in|Reason:|not responding|FATAL EXCEPTION|Force finishing|am_anr|LOW MEMORY|lowmemorykiller" /tmp/logcat.txt | head -n 40
          echo '### CPU and memory at the freeze'
          grep -A 12 -m 1 "ANR in" /tmp/logcat.txt || true
          echo '### last 40 lines'
          tail -n 40 /tmp/logcat.txt

  # iOS is Phase 1b: needs an xcodebuild lane, a pinned simulator runtime and a
  # ~/.agent-device cache, none measured yet.
