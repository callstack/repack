packages:
  - "packages/*"
  - "apps/*"
  - "tests/*"
  - "website"

autoInstallPeers: false
linkWorkspacePackages: true
packageManagerStrict: true
packageManagerStrictVersion: false
updateNotifier: false

overrides:
  "caniuse-lite": ^1.0.30001774
  # Security fixes for advisories in @module-federation/dts-plugin, which pins
  # these to exact versions. Current MF releases are fixed; these are only
  # still reached through the older MF versions pinned on purpose for
  # compatibility coverage (packages/repack and tests/integration devDeps).
  "koa@2": ^2.16.4
  "koa@3": ^3.1.2
  "ws@8": ^8.21.1
  "adm-zip": ^0.6.1
  # Security fix for GHSA-67mh-4wv8-2f99, reached only through
  # @modern-js/node-bundle-require inside @module-federation/cli.
  "esbuild@<0.25.0": ^0.25.0
  # Security fix for GHSA-w5hq-g745-h8pq. xcode pins uuid to ^7 and is
  # unmaintained; it only calls uuid.v4(), which is unaffected either way.
  "uuid@7": ^11.1.1
  # expo-router declares react-native-screens as a regular dependency, which
  # would otherwise resolve a second, newer copy than the apps' native one.
  "react-native-screens": "catalog:testers"

allowBuilds:
  "@biomejs/biome": true
  "@swc/core": true
  "core-js": true
  "esbuild": true

catalog:
  "@babel/core": ^7.29.7
  "@rspack/core": ^2.2.8
  "@rslib/core": ^1.0.3
  "@swc/helpers": ^0.5.23
  "@types/node": ^22.20.5
  "terser-webpack-plugin": ^5.6.1
  "typescript": ^7.0.2
  # Held: 5.106+ removes a webpack internal needed by @module-federation/enhanced <2.4.0.
  "webpack": ~5.105.0
  "react": "19.2.8"
  "react-native": "0.86.3"
  "vite": ^8.3.4
  "vitest": ^5.0.3

catalogs:
  # Expo-only packages. Libraries shared with the other testers come from the
  # `testers` catalog, so some are newer than Expo SDK 57's recommended pins.
  expo57:
    "babel-preset-expo": ~57.0.13
    "expo": ~57.0.26
    "expo-asset": ~57.0.18
    "expo-constants": ~57.0.20
    "expo-font": ~57.0.4
    "expo-linking": ~57.0.11
    "expo-router": ~57.0.24
    "expo-status-bar": ~57.0.1
    "react-native-gesture-handler": ~2.32.0
  testers:
    "@types/react": ^19.2.0
    # Held: 5.4.5 is the newest release, and it caps react-native at <0.87.
    "react-native-test-app": 5.4.5
    "@module-federation/enhanced": "2.9.2"
    "@module-federation/runtime": "2.9.2"
    "@react-native-async-storage/async-storage": "3.1.1"
    "@react-native/babel-preset": "0.86.3"
    "@react-native/community-cli-plugin": "0.86.3"
    "@react-native/typescript-config": "0.86.3"
    "@react-native-community/cli": "20.2.0"
    "@react-native-community/cli-platform-android": "20.2.0"
    "@react-native-community/cli-platform-ios": "20.2.0"
    "react-native-reanimated": "4.5.3"
    "react-native-safe-area-context": "5.8.0"
    "react-native-screens": "4.26.2"
    "react-native-worklets": "0.11.3"
