packages:
  - "packages/*"
  - "apps/*"
  - "tests/*"
  - "website"

autoInstallPeers: false
linkWorkspacePackages: true
packageManagerStrict: true
packageManagerStrictVersion: false
updateNotifier: false

overrides:
  "caniuse-lite": ^1.0.30001774
  # Security fixes for advisories in @module-federation/dts-plugin, which pins
  # these to exact versions - no parent upgrade can reach them.
  "koa@2": ^2.16.4
  "koa@3": ^3.1.2
  "ws@8": ^8.21.1
  "adm-zip": ^0.6.0

allowBuilds:
  "@biomejs/biome": true
  "@swc/core": true
  "core-js": true
  "esbuild": true

catalog:
  # Pinned: 1.6.2+ breaks MF v2 polyfill ordering; 1.6.4+ fails typecheck.
  "@rspack/core": 1.6.0
  "@rslib/core": ^0.6.3
  "@swc/helpers": ~0.5.17
  "@types/node": ^20.19.31
  # Pinned: 5.6+ silently skips minification (#1390).
  "terser-webpack-plugin": 5.5.0
  "typescript": ^5.9.3
  # Held: 5.106+ removes a webpack internal needed by @module-federation/enhanced <2.4.0.
  "webpack": ~5.105.0
  "react": "19.2.3"
  "react-native": "0.84.1"
  "vitest": ^4.1.0

catalogs:
  testers:
    "@types/react": ^19.2.0
    "react-native-test-app": 5.1.0
    "@react-native/babel-preset": "0.84.1"
    "@react-native/typescript-config": "0.84.1"
    "@react-native-community/cli": "20.1.2"
    "@react-native-community/cli-platform-android": "20.1.2"
    "@react-native-community/cli-platform-ios": "20.1.2"
