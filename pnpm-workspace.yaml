packages:
  - "packages/*"
  - "apps/*"
  # standalone Rspack 1 lab - has its own node_modules and installs repack
  # from a packed tarball, so workspace resolution never leaks into it
  - "!apps/tester-app-rspack1"
  - "tests/*"
  - "website"

autoInstallPeers: false
linkWorkspacePackages: true
packageManagerStrict: true
packageManagerStrictVersion: false
updateNotifier: false

overrides:
  "caniuse-lite": ^1.0.30001774

allowBuilds:
  "@biomejs/biome": true
  "@swc/core": true
  "core-js": true
  "esbuild": true

# Rspack 2 is the workspace default - it is the maintained line and what
# in-workspace apps actually run (repack's own @rspack/core@^2 devDependency
# shadows any app-level pin; see agent_context/rspackv2-jul2026/08). The
# Rspack 1 surfaces are the standalone apps/tester-app-rspack1 lab and
# repack's aliased @rspack/core-v1 jest lane (pnpm test:rspack1).
catalog:
  "@rspack/core": ^2.1.2
  "@rspack/plugin-react-refresh": ^2.0.2
  "@rslib/core": ^0.6.3
  "@swc/helpers": ^0.5.23
  "@types/node": ^20.19.31
  "terser-webpack-plugin": ^5.3.14
  "typescript": ^5.9.3
  "webpack": ^5.104.1
  "react": "19.2.3"
  "react-native": "0.84.1"
  "vitest": ^4.1.0

catalogs:
  testers:
    "@types/react": ^19.2.0
    "react-native-test-app": 5.1.0
    "@react-native/babel-preset": "0.84.1"
    "@react-native/typescript-config": "0.84.1"
    "@react-native-community/cli": "20.1.2"
    "@react-native-community/cli-platform-android": "20.1.2"
    "@react-native-community/cli-platform-ios": "20.1.2"
